name: FORGE Research Authority Lifecycle

on:
  push:
    branches:
      - research/authority-lifecycle-gauntlet
  pull_request:
    paths:
      - 'docs/research/**'
      - 'forge_core/context_grants.py'
      - 'forge_core/provenance_policy.py'
      - 'tests/test_context_grants.py'
      - 'tests/test_provenance_policy.py'
      - '.github/workflows/research-a0-context-authority.yml'

permissions:
  contents: read

jobs:
  authority-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile research kernels
        run: >-
          python3 -m compileall -q
          forge_core/context_grants.py
          forge_core/provenance_policy.py
          tests/test_context_grants.py
          tests/test_provenance_policy.py
      - name: Run A0 dynamic-context matrix
        run: python3 -m unittest -v tests.test_context_grants
      - name: Run A1 provenance-composition matrix
        run: python3 -m unittest -v tests.test_provenance_policy
      - name: Whitespace gate
        run: git diff --check
