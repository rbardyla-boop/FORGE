name: FORGE W4 Broker Bridge Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build immutable W4 W3 and W2 fixture images
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info >/dev/null
          docker build -f tests/w4_fixture/broker/Dockerfile -t forge-w4-broker:terminal .
          docker build -f tests/w4_fixture/provider/Dockerfile -t forge-w4-provider:terminal .
          docker build -f tests/w4_fixture/codex_provider/Dockerfile -t forge-w4-codex-provider:terminal .
          docker build -f tests/w4_fixture/upstream/Dockerfile -t forge-w4-upstream:terminal .
          docker build -f tests/w3_container/Dockerfile -t forge-w3-fixture:terminal .
          docker build -t forge-w2-fixture:terminal tests/w2_fixture
          BROKER_ID="$(docker image inspect forge-w4-broker:terminal --format '{{.Id}}')"
          PROVIDER_ID="$(docker image inspect forge-w4-provider:terminal --format '{{.Id}}')"
          CODEX_PROVIDER_ID="$(docker image inspect forge-w4-codex-provider:terminal --format '{{.Id}}')"
          UPSTREAM_ID="$(docker image inspect forge-w4-upstream:terminal --format '{{.Id}}')"
          W3_IMAGE_ID="$(docker image inspect forge-w3-fixture:terminal --format '{{.Id}}')"
          W2_IMAGE_ID="$(docker image inspect forge-w2-fixture:terminal --format '{{.Id}}')"
          for IMAGE_ID in "$BROKER_ID" "$PROVIDER_ID" "$CODEX_PROVIDER_ID" "$UPSTREAM_ID" "$W3_IMAGE_ID" "$W2_IMAGE_ID"; do
            case "$IMAGE_ID" in sha256:*) ;; *) echo 'fixture did not resolve to immutable image ID' >&2; exit 1;; esac
          done
          echo "FORGE_W4_BROKER_IMAGE_ID=$BROKER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_PROVIDER_IMAGE_ID=$PROVIDER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_CODEX_PROVIDER_IMAGE_ID=$CODEX_PROVIDER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_UPSTREAM_IMAGE_ID=$UPSTREAM_ID" >> "$GITHUB_ENV"
          echo "FORGE_W3_IMAGE_ID=$W3_IMAGE_ID" >> "$GITHUB_ENV"
          echo "FORGE_W2_IMAGE_ID=$W2_IMAGE_ID" >> "$GITHUB_ENV"
      - name: Compile candidate
        run: python3 -m compileall -q forge_core tests
      - name: W4 front-gate request auth and budget policy 10/10
        run: python3 -m unittest -v tests.test_w4_gate_policy
      - name: W4 generated Codex broker config authority 6/6
        run: python3 -m unittest -v tests.test_w4_codex_config
      - name: W4 official Responses proxy live policy 4/4
        run: python3 -m unittest -v tests.test_w4_proxy_policy
      - name: W4 credentialless dual-network broker attacks 12/12
        run: python3 -m unittest -v -f tests.test_w4_bridge
      - name: W4 dual-network no-routing negative control 1/1
        run: python3 -m unittest -v tests.test_w4_network_routing
      - name: W4 Codex-shaped streaming broker and failure composition 8/8
        run: python3 -m unittest -v -f tests.test_w4_codex_bridge
      - name: W3 Repair 001 strict executable authority 5/5
        run: python3 -m unittest -v tests.test_w3_repair_001
      - name: W3 executable config credential authority 12/12
        run: python3 -m unittest -v tests.test_w3_executable
      - name: W3 JSONL process behavior 12/12
        run: python3 -m unittest -v tests.test_w3_jsonl
      - name: W3 W2-W1 composition 10/10
        run: python3 -m unittest -v tests.test_w3_composition
      - name: W3 actual W2-contained Codex-shaped seam 3/3
        run: python3 -m unittest -v tests.test_w3_contained
      - name: W2 Repair 001 reclaimability 7/7
        run: python3 -m unittest -v tests.test_w2_repair_001
      - name: W2 active isolation 12/12
        run: python3 -m unittest -v tests.test_w2_isolation
      - name: W2 workspace and egress 13/13
        run: python3 -m unittest -v tests.test_w2_workspace_output
      - name: W2 execution authority and handoff 13/13
        run: python3 -m unittest -v tests.test_w2_authority
      - name: W2 amended request/output attacks 2/2
        run: python3 -m unittest -v tests.test_w2_additional
      - name: W1 request authority 7/7
        run: python3 -m unittest -v tests.test_w1_request
      - name: W1 proposal submission 10/10
        run: python3 -m unittest -v tests.test_w1_submission
      - name: W1 stale integrity and handoff 10/10
        run: python3 -m unittest -v tests.test_w1_integrity
      - name: Foundation Repair 001 5/5
        run: python3 -m unittest -v tests.test_foundation_repair_001
      - name: Foundation Repair 002 10/10
        run: python3 -m unittest -v tests.test_foundation_repair_002
      - name: Foundation system matrix FG-A00 through FG-A16
        run: python3 -m unittest -v -f tests.test_foundation_gate
      - name: F6 registration and integrity 7/7
        run: python3 -m unittest -v tests.test_f6_registration
      - name: F6 closure and replay 9/9
        run: python3 -m unittest -v tests.test_f6_closure
      - name: F6 lifecycle inheritance 4/4
        run: python3 -m unittest -v tests.test_f6_integration
      - name: F5 matrix 12/12
        run: python3 -m unittest -v tests.test_f5_matrix
      - name: F5 final gate 10/10
        run: python3 -m unittest -v tests.test_final_gate
      - name: F4 lifecycle 22/22
        run: |
          python3 -m unittest -v tests.test_f4_1
          python3 -m unittest -v tests.test_f4_2
          python3 -m unittest -v tests.test_f4_3
          python3 -m unittest -v tests.test_f4_4
      - name: F4 Repair 002 1/1
        run: python3 -m unittest -v tests.test_f4_repair_002
      - name: F3 Doctor 20/20
        run: python3 -m unittest -v tests.test_f3
      - name: F3 Repair 002 3/3
        run: python3 -m unittest -v tests.test_f3_repair_002
      - name: F2 Contract Authority 14/14
        run: python3 -m unittest -v tests.test_f2
      - name: F2 Repair 002 4/4
        run: python3 -m unittest -v tests.test_f2_repair_002
      - name: F1 canonical state 11/11
        run: python3 -m unittest -v tests.test_f1
      - name: Whitespace guard
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
