name: FORGE W4 Broker Bridge Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build immutable W4 fixture images
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info >/dev/null
          docker build -f tests/w4_fixture/broker/Dockerfile -t forge-w4-broker:validation .
          docker build -f tests/w4_fixture/provider/Dockerfile -t forge-w4-provider:validation .
          docker build -f tests/w4_fixture/codex_provider/Dockerfile -t forge-w4-codex-provider:validation .
          docker build -f tests/w4_fixture/upstream/Dockerfile -t forge-w4-upstream:validation .
          BROKER_ID="$(docker image inspect forge-w4-broker:validation --format '{{.Id}}')"
          PROVIDER_ID="$(docker image inspect forge-w4-provider:validation --format '{{.Id}}')"
          CODEX_PROVIDER_ID="$(docker image inspect forge-w4-codex-provider:validation --format '{{.Id}}')"
          UPSTREAM_ID="$(docker image inspect forge-w4-upstream:validation --format '{{.Id}}')"
          case "$BROKER_ID" in sha256:*) ;; *) exit 1;; esac
          case "$PROVIDER_ID" in sha256:*) ;; *) exit 1;; esac
          case "$CODEX_PROVIDER_ID" in sha256:*) ;; *) exit 1;; esac
          case "$UPSTREAM_ID" in sha256:*) ;; *) exit 1;; esac
          echo "FORGE_W4_BROKER_IMAGE_ID=$BROKER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_PROVIDER_IMAGE_ID=$PROVIDER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_CODEX_PROVIDER_IMAGE_ID=$CODEX_PROVIDER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_UPSTREAM_IMAGE_ID=$UPSTREAM_ID" >> "$GITHUB_ENV"
      - name: Compile candidate
        run: python3 -m compileall -q forge_core tests
      - name: W4 front-gate request auth and budget policy 10/10
        run: python3 -m unittest -v tests.test_w4_gate_policy
      - name: W4 generated Codex broker config authority 6/6
        run: python3 -m unittest -v tests.test_w4_codex_config
      - name: W4 official Responses proxy live policy 4/4
        run: python3 -m unittest -v tests.test_w4_proxy_policy
      - name: W4 initial credentialless dual-network broker attacks 12/12
        run: python3 -m unittest -v -f tests.test_w4_bridge
      - name: W4 dual-network no-routing negative control 1/1
        run: python3 -m unittest -v tests.test_w4_network_routing
      - name: W4 Codex-shaped streaming broker and failure composition 8/8
        run: python3 -m unittest -v -f tests.test_w4_codex_bridge
      - name: Whitespace guard
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
