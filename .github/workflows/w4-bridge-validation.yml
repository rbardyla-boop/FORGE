name: FORGE W4 Broker Bridge Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build immutable W4 fixture images
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info >/dev/null
          docker build -f tests/w4_fixture/broker/Dockerfile -t forge-w4-broker:validation .
          docker build -f tests/w4_fixture/provider/Dockerfile -t forge-w4-provider:validation .
          docker build -f tests/w4_fixture/upstream/Dockerfile -t forge-w4-upstream:validation .
          BROKER_ID="$(docker image inspect forge-w4-broker:validation --format '{{.Id}}')"
          PROVIDER_ID="$(docker image inspect forge-w4-provider:validation --format '{{.Id}}')"
          UPSTREAM_ID="$(docker image inspect forge-w4-upstream:validation --format '{{.Id}}')"
          case "$BROKER_ID" in sha256:*) ;; *) exit 1;; esac
          case "$PROVIDER_ID" in sha256:*) ;; *) exit 1;; esac
          case "$UPSTREAM_ID" in sha256:*) ;; *) exit 1;; esac
          echo "FORGE_W4_BROKER_IMAGE_ID=$BROKER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_PROVIDER_IMAGE_ID=$PROVIDER_ID" >> "$GITHUB_ENV"
          echo "FORGE_W4_UPSTREAM_IMAGE_ID=$UPSTREAM_ID" >> "$GITHUB_ENV"
      - name: Compile candidate
        run: python3 -m compileall -q forge_core tests
      - name: W4 initial credentialless dual-network broker attacks
        run: python3 -m unittest -v -f tests.test_w4_bridge
      - name: Whitespace guard
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
